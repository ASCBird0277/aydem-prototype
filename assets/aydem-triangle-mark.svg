<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-labelledby="title desc">
  <title id="title">AYDEM three-triangle mark</title>
  <desc id="desc">Three interlocking, dimensional blue, gold, and teal triangle tubes.</desc>
  <defs>
    <linearGradient id="navyTube" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78a8e8"/><stop offset=".26" stop-color="#1f5b9b"/><stop offset=".62" stop-color="#0a2a4d"/><stop offset="1" stop-color="#173d71"/></linearGradient>
    <linearGradient id="goldTube" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a2"/><stop offset=".24" stop-color="#f6c64d"/><stop offset=".62" stop-color="#b47713"/><stop offset="1" stop-color="#e6a82e"/></linearGradient>
    <linearGradient id="tealTube" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ff1e9"/><stop offset=".25" stop-color="#1cc7c1"/><stop offset=".62" stop-color="#087d83"/><stop offset="1" stop-color="#13aaa9"/></linearGradient>
    <filter id="tubeShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#tubeShadow)">
    <path d="M120 22 207 182H33Z" stroke="#071b33" stroke-width="25" opacity=".9"/><path d="M120 22 207 182H33Z" stroke="url(#navyTube)" stroke-width="17"/>
    <path d="M34 50h172l-86 158Z" stroke="#6d4308" stroke-width="25" opacity=".82"/><path d="M34 50h172l-86 158Z" stroke="url(#goldTube)" stroke-width="17"/>
    <path d="m29 122 148-86-31 172Z" stroke="#07565e" stroke-width="25" opacity=".84"/><path d="m29 122 148-86-31 172Z" stroke="url(#tealTube)" stroke-width="17"/>
    <path d="M120 22 207 182H33Z" stroke="#fff" stroke-width="2" opacity=".42"/><path d="M34 50h172l-86 158Z" stroke="#fff" stroke-width="2" opacity=".34"/><path d="m29 122 148-86-31 172Z" stroke="#fff" stroke-width="2" opacity=".34"/>
  </g>
</svg>
